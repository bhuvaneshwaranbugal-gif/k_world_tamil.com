<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>K World Tamil | Telegram</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description"
content="K World Tamil Telegram Channels & Groups. Korean drama Tamil updates, edits and fan community.">

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:radial-gradient(circle at top,#222,#000);
    color:white;
    perspective:1200px;
}

/* 3D SLIDE TITLE */
.title{
    text-align:center;
    font-size:34px;
    font-weight:bold;
    margin:30px 0;
    color:#e50914;
    animation:float 3s ease-in-out infinite;
}
@keyframes float{
    0%{transform:translateZ(0);}
    50%{transform:translateZ(40px);}
    100%{transform:translateZ(0);}
}

/* CONTAINER */
.container{
    max-width:950px;
    margin:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:35px;
}

/* 3D CARD */
.card{
    display:flex;
    background:#111;
    border-radius:20px;
    overflow:hidden;
    transform-style:preserve-3d;
    transition:transform 0.4s, box-shadow 0.4s;
    box-shadow:0 20px 40px rgba(0,0,0,0.6);
}
.card:hover{
    transform:rotateY(-12deg) translateZ(40px);
    box-shadow:0 40px 80px rgba(229,9,20,0.4);
}

/* IMAGE */
.card img{
    width:45%;
    object-fit:cover;
    transform:translateZ(30px);
}

/* TEXT SIDE */
.card .text{
    width:55%;
    padding:30px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    transform:translateZ(50px);
}
.card h2{
    margin:0 0 10px;
    color:#e50914;
    font-size:22px;
}
.card p{
    margin:0;
    color:#ccc;
    font-size:15px;
}

/* MOBILE */
@media(max-width:750px){
    .card{
        flex-direction:column;
    }
    .card img,
    .card .text{
        width:100%;
    }
    .card:hover{
        transform:translateZ(30px);
    }
}
</style>
</head>

<body>

<div class="title">🎬 K WORLD TAMIL 🎬</div>

<div class="container">

    <!-- 1st PHOTO - CHANNEL -->
    <a href="https://t.me/k_world_tamil" target="_blank" style="text-decoration:none;color:inherit;">
        <div class="card">
            <img src="image1.jpg">
            <div class="text">
                <h2>Telegram Channel</h2>
                <p>Korean drama Tamil updates, posters & edits.</p>
            </div>
        </div>
    </a>

    <!-- 2nd PHOTO - GROUP -->
    <a href="https://t.me/+LxoCb5-G9IlmZmM1" target="_blank" style="text-decoration:none;color:inherit;">
        <div class="card">
            <img src="image2.jpg">
            <div class="text">
                <h2>Telegram Group</h2>
                <p>Fan discussions, episode talks & recommendations.</p>
            </div>
        </div>
    </a>

    <!-- 3rd PHOTO - CHANNEL -->
    <a href="https://t.me/+I5s_FCxrENEwMDA1" target="_blank" style="text-decoration:none;color:inherit;">
        <div class="card">
            <img src="image3.jpg">
            <div class="text">
                <h2>Telegram Channel</h2>
                <p>K-Drama scenes, romantic edits & reels.</p>
            </div>
        </div>
    </a>

</div>

</body>
</html>
